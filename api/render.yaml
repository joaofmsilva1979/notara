services:
  - type: web
    name: notara-api
    runtime: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
    disk:
      name: notara-tmp
      mountPath: /tmp
      sizeGB: 1
